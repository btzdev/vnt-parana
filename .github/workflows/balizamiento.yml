name: Actualizar balizamiento

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, minuto 17 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: balizamiento
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar avisos SHN, señales OpenSeaMap y METAR SMN
        run: python scripts/balizamiento.py
      - name: Acumular traza real del canal (AIS)
        continue-on-error: true
        run: |
          pip install --quiet websockets
          python scripts/canal_ais.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Profundidades del canal (planilla diaria de determinantes, ANPYN)
        continue-on-error: true
        run: |
          npm install --no-save --silent pdfjs-dist@4.4.168
          node scripts/determinantes.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add balizamiento.json
          for f in meteo.json canal.json determinantes.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Balizamiento $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
